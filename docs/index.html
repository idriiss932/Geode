<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Géode">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Géode — le jeu qui creuse tout seul</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;500;600;700&display=swap">
<style>
:root{--teal:#34e8c8;--amber:#ffc66b;--ink:#e9fffb;--dim:#7fa9b1;--card:rgba(255,255,255,.045);--line:rgba(150,240,225,.16)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#06121a;overflow:hidden;font-family:Geist,Inter,"SF Pro Display","Helvetica Neue",system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#app{position:relative;z-index:1;height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
#hud{padding:calc(12px + env(safe-area-inset-top)) 16px 2px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.coins{display:flex;align-items:center;gap:9px}
.coin-ic{width:22px;height:22px;transform:rotate(45deg);border-radius:4px;background:linear-gradient(135deg,#fff3c4,#ffc66b 55%,#e8923a);box-shadow:0 0 14px rgba(255,198,107,.55);flex:none;margin:0 3px}
#coins{transform-origin:left center;font-size:34px;font-weight:300;letter-spacing:.01em;line-height:1}
#cps{font-size:12px;color:var(--dim);letter-spacing:.08em;margin-top:3px}
.hr{display:flex;align-items:center;gap:10px}
.gems{display:flex;align-items:center;gap:7px;font-size:18px;font-weight:400;color:#c9b8ff}
.gem-ic{width:14px;height:14px;transform:rotate(45deg);background:linear-gradient(135deg,#efe6ff,#a98bff 60%,#6e52e0);border-radius:3px;box-shadow:0 0 10px rgba(169,139,255,.6)}
#jrn,#reset,#mute{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.05);color:#fff;font-size:15px;cursor:pointer}
#reset.arm{background:rgba(255,80,90,.25);border-color:#ff6670;color:#ffd0d3}
#prog{padding:6px 16px 0}
#depthrow{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
#bar{height:3px;background:rgba(255,255,255,.1);border-radius:2px;margin-top:5px;overflow:hidden}
#barf{height:100%;width:0;background:linear-gradient(90deg,#34e8c8,#9ff7e6);box-shadow:0 0 10px rgba(52,232,200,.8);border-radius:2px}
#boosts{display:flex;gap:6px;padding:6px 16px 0;min-height:22px}
.bchip{font-size:11px;letter-spacing:.08em;padding:3px 9px;border-radius:20px;border:1px solid rgba(255,198,107,.5);color:var(--amber);background:rgba(255,198,107,.08)}
#stage{flex:1;min-height:0;position:relative}
#c{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#panel{height:41%;max-height:420px;min-height:250px;background:linear-gradient(180deg,rgba(9,26,36,.9),rgba(5,14,20,.98));border-top:1px solid var(--line);display:flex;flex-direction:column;border-radius:18px 18px 0 0}
#tabs{display:flex;padding:0 6px}
.tab{flex:1;padding:13px 2px 11px;font-size:11px;font-weight:500;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);text-align:center;cursor:pointer;border-bottom:2px solid transparent}
.tab.on{color:var(--ink);border-color:var(--teal)}
.tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--amber);margin-left:5px;vertical-align:middle;box-shadow:0 0 8px var(--amber)}
#list{flex:1;overflow-y:auto;padding:10px 10px 18px;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start;-webkit-overflow-scrolling:touch}
.cd{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 10px 10px;position:relative;text-align:center}
.cd .bd{position:absolute;left:9px;top:8px;min-width:22px;height:22px;border-radius:11px;border:1px solid var(--line);font-size:12px;line-height:20px;color:var(--dim)}
.cd .orb{width:34px;height:34px;margin:6px auto 4px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--c) 45%,transparent 72%);box-shadow:0 0 18px var(--c),0 0 40px var(--c)}
.cd .dv{font-size:20px;font-weight:300}
.cd .lv{font-size:10px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;margin-bottom:8px}
.row{display:flex;gap:6px}
.g{flex:1;border:0;border-radius:9px;padding:8px 2px;font-family:inherit;font-size:12px;font-weight:500;line-height:1.25;color:#04211c;background:linear-gradient(180deg,#5cf5d9,#25c9ab);box-shadow:0 3px 0 #138c78;cursor:pointer;touch-action:manipulation}
.g.am{background:linear-gradient(180deg,#ffd98a,#f1a940);box-shadow:0 3px 0 #b3731c}
.g.vi{background:linear-gradient(180deg,#d4c3ff,#9d7cf5);box-shadow:0 3px 0 #6246c4;color:#1d1040}
.g.off{background:#2b3d45;color:#7b929b;box-shadow:0 3px 0 #1b2a30}
.g:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.g small{display:block;font-weight:300;font-size:10.5px;opacity:.85}
.wide{grid-column:1/-1}
.cm{grid-column:1/-1;display:grid;grid-template-columns:50px 1fr;gap:6px 12px;align-items:center;text-align:left;padding:12px}
.cm .orb{margin:0;width:42px;height:42px}
.cm .nm{font-size:15px;font-weight:500}
.cm .st{font-size:12px;font-weight:300;color:#a9c7cd;margin-top:2px;line-height:1.35}
.cm .st b{color:#fff;font-weight:500}
.cm .row,.cm .b0{grid-column:1/-1}
.cm .g{font-size:13px;padding:9px 4px}
.cm .g small{font-size:11px;margin-top:1px}
.help{grid-column:1/-1;font-size:12px;font-weight:300;line-height:1.5;color:#a9c7cd;padding:2px 6px 4px}
.help b{color:var(--ink);font-weight:500}
.ur{display:flex;align-items:center;gap:10px;text-align:left}
.ur .tx{flex:1;min-width:0}
.ur .nm{font-size:14px;font-weight:500}
.ur .ds{font-size:11.5px;font-weight:300;color:#a9c7cd;line-height:1.35;margin-top:2px}
.ur .g{flex:none;width:96px}
.tm{height:3px;background:rgba(255,255,255,.1);border-radius:2px;margin-top:6px;overflow:hidden}
.tm i{display:block;height:100%;background:var(--amber)}
.vt{text-align:center;padding:6px 8px}
.vt h3{margin:4px 0 6px;font-weight:300;font-size:22px}
.vt p{margin:0 0 10px;font-size:12.5px;font-weight:300;line-height:1.5;color:#a9c7cd}
.vt .big{font-size:32px;font-weight:200;color:#c9b8ff}
#toast{position:fixed;left:50%;top:84px;transform:translate(-50%,-12px);background:rgba(8,24,32,.94);border:1px solid var(--line);padding:10px 18px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.35s;z-index:9;text-align:center;max-width:86%}
#toast.on{opacity:1;transform:translate(-50%,0)}

.g{position:relative;overflow:hidden}
.g::before{content:'';position:absolute;left:0;right:0;top:0;height:48%;background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,0));pointer-events:none}
.g.off::before{display:none}
.cd{background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.02));box-shadow:0 8px 20px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.06)}
#coins{text-shadow:0 0 22px rgba(255,198,107,.4)}
#bar{height:4px}
#barf{transition:width .35s cubic-bezier(.2,.8,.2,1)}
#panel{box-shadow:0 -14px 34px rgba(0,0,0,.45),inset 0 1px 0 rgba(150,240,225,.12)}
.tab.on{text-shadow:0 0 12px rgba(52,232,200,.55)}
.tab{transition:color .2s}
.g{transition:filter .15s}
.g:not(.off):hover{filter:brightness(1.08)}
.mbtn{flex:none;align-self:center;margin:0 8px 0 2px;padding:7px 10px;min-width:56px;text-align:center;border-radius:14px;border:1px solid rgba(255,198,107,.55);background:rgba(255,198,107,.12);color:var(--amber);font-size:12px;font-weight:600;letter-spacing:.05em;cursor:pointer}
.mbtn:active{transform:scale(.94)}
.tab{letter-spacing:.09em;font-size:10.5px}
.act{flex:1;display:flex;gap:4px;min-width:0}
.act .g{min-width:0}
.xm{flex:none;width:36px;border-radius:9px;border:1px solid rgba(255,198,107,.55);background:rgba(255,198,107,.12);color:var(--amber);font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;padding:0;touch-action:manipulation}
.xm:active{transform:scale(.92)}
.cm .row,.cm .b0w{grid-column:1/-1}
.cm .row{gap:8px}
.ur .xm{height:44px}
.ur .g{width:88px}
#tuto{position:absolute;left:50%;top:10px;transform:translate(-50%,0);z-index:3;display:flex;gap:14px;align-items:center;width:min(88%,320px);padding:14px 18px 14px 14px;border-radius:22px;background:linear-gradient(160deg,rgba(16,38,52,.80),rgba(6,16,24,.88));border:1px solid rgba(255,255,255,.16);box-shadow:0 14px 40px rgba(0,0,0,.5),0 0 44px rgba(52,232,200,.16);pointer-events:none;transition:opacity .5s,transform .5s}
#tuto.out{opacity:0;transform:translate(-50%,-14px) scale(.94)}
.tt-ic{position:relative;flex:none;width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#7bf7e0,#25c9ab);box-shadow:0 6px 18px rgba(52,232,200,.4)}
.tt-ic::after{content:'';position:absolute;inset:0;border-radius:16px;border:2px solid #5cf5d9;animation:rip 1.6s ease-out infinite}
.tt-ic svg{width:28px;height:28px;animation:tapb 1.6s ease-in-out infinite}
@keyframes rip{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.7);opacity:0}}
@keyframes tapb{0%,100%{transform:translateY(0)}35%{transform:translateY(4px) scale(.9)}}
.tt-tx b{display:block;font-size:16.5px;font-weight:600;letter-spacing:.01em}
.tt-tx span{display:block;margin-top:2px;font-size:12.5px;font-weight:300;line-height:1.4;color:#b9d6dc}
.pips{display:flex;gap:6px;margin-top:9px}
.pips i{width:24px;height:4px;border-radius:3px;background:rgba(255,255,255,.18);transition:.3s}
.pips i.on{background:#ffc66b;box-shadow:0 0 8px #ffc66b}
.gg{height:7px;border-radius:5px;background:rgba(0,0,0,.3);margin:6px 8px 0;overflow:hidden}
.gg i{display:block;height:100%;border-radius:5px;background:rgba(255,255,255,.92);transition:width .25s}
.g.off .gg i{background:#ffc66b}
.gg.full i{background:#ff7a7a}
@keyframes hl{0%,100%{box-shadow:0 0 0 0 rgba(255,198,107,0)}25%,75%{box-shadow:0 0 0 2px #ffc66b,0 0 26px rgba(255,198,107,.6)}}
.cd.hl{animation:hl 2s ease-in-out;border-color:#ffc66b}
#tt-skip{display:inline-block;margin-top:8px;font-size:11px;color:#7fa9b1;text-decoration:underline;pointer-events:auto;cursor:pointer;padding:4px 0}
.tpulse{animation:tpl 1.3s ease-in-out infinite;position:relative;z-index:2}
@keyframes tpl{0%,100%{box-shadow:0 0 0 0 rgba(255,198,107,.95)}60%{box-shadow:0 0 0 9px rgba(255,198,107,0)}}
.tab.tpulse{color:#ffc66b;border-radius:10px}
.sect{grid-column:1/-1;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);padding:8px 4px 0}
.stg{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;text-align:left;width:100%}
.stg b{display:block;font-size:20px;font-weight:300}
.stg span{font-size:10.5px;color:var(--dim);letter-spacing:.06em}
.vt .rec{font-size:12.5px;font-weight:500;color:#9ff7e6}
.tab{letter-spacing:.06em;font-size:10px;padding-left:1px;padding-right:1px}
#gems{display:inline-block;transition:transform .35s cubic-bezier(.2,2,.4,1)}
#barf{position:relative;overflow:hidden}
#barf::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);transform:translateX(-100%);animation:shm 2.4s ease-in-out infinite}
@keyframes shm{to{transform:translateX(100%)}}
.enter{animation:cin .4s cubic-bezier(.2,.9,.2,1) both}
@keyframes cin{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ===== DA 2026 : obsidienne + verre dépoli ===== */
:root{--teal:#b6ff4a;--ink:#f3f4fa;--dim:#8b90a6;--card:rgba(255,255,255,.04);--line:rgba(255,255,255,.1)}
html,body{background:#05060a}
#coins{font-weight:600;letter-spacing:-.025em;font-variant-numeric:tabular-nums;font-size:36px}
#cps{font-variant-numeric:tabular-nums;letter-spacing:.04em}
.coin-ic{box-shadow:0 0 18px rgba(255,200,97,.45)}
#jrn,#mute,#reset{background:rgba(255,255,255,.06);border:1px solid var(--line);}
#depthrow{letter-spacing:.16em;font-weight:500}
#bar{height:5px;background:rgba(255,255,255,.08)}
#barf{background:linear-gradient(90deg,#b6ff4a,#4af0c0);box-shadow:0 0 16px rgba(182,255,74,.55)}
.bchip{border-color:rgba(255,200,97,.4);background:rgba(255,200,97,.1);}
#panel{margin:0 8px 8px;border-radius:30px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(24,26,42,.94),rgba(8,9,16,.98));box-shadow:0 24px 50px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.09);}
#tabs{margin:8px 8px 0;padding:4px;gap:2px;background:rgba(255,255,255,.05);border-radius:20px}
.tab{border-bottom:0;border-radius:16px;padding:10px 1px;color:var(--dim);transition:background .2s,color .2s}
.tab.on{background:rgba(255,255,255,.11);color:#fff;text-shadow:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.tab .dot{background:var(--teal);box-shadow:0 0 8px var(--teal)}
.cd{border-radius:22px;background:linear-gradient(160deg,rgba(255,255,255,.065),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.08);box-shadow:none}
.cd .orb,.cm .orb{box-shadow:0 0 22px var(--c),0 0 50px -6px var(--c)}
.g{border-radius:15px;background:linear-gradient(180deg,#cbff72,#9be82f);color:#0b1402;box-shadow:0 10px 20px -10px rgba(182,255,74,.75),inset 0 1px 0 rgba(255,255,255,.5);font-weight:600}
.g.am{background:linear-gradient(180deg,#ffdc92,#ffb340);color:#2b1700;box-shadow:0 10px 20px -10px rgba(255,179,64,.7),inset 0 1px 0 rgba(255,255,255,.5)}
.g.vi{background:linear-gradient(180deg,#cdbdff,#8d6bff);color:#150a38;box-shadow:0 10px 20px -10px rgba(141,107,255,.75),inset 0 1px 0 rgba(255,255,255,.45)}
.g.off{background:rgba(255,255,255,.055);color:#7d8296;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.g:active{transform:scale(.97);box-shadow:none}
.g::before{background:linear-gradient(rgba(255,255,255,.2),rgba(255,255,255,0))}
.xm{border-radius:13px;border-color:rgba(255,200,97,.35);background:rgba(255,200,97,.09)}
.tm i{background:linear-gradient(90deg,#ffc861,#ffe29a)}
.gg i{background:rgba(10,20,2,.85)}
.g.off .gg i{background:#ffc861}
.cm .st b{color:#fff}
#toast{background:rgba(14,15,24,.96);border-radius:18px;border:1px solid var(--line)}
.tt-ic{background:linear-gradient(135deg,#d6ff80,#8fe82a);box-shadow:0 6px 20px rgba(182,255,74,.4)}
.tt-ic::after{border-color:#b6ff4a}
#tuto{border-radius:26px;background:linear-gradient(160deg,rgba(26,28,46,.95),rgba(8,9,16,.97))}
.vt .rec{color:#c9ff72}
#nova{position:absolute;right:14px;bottom:16px;width:76px;height:76px;border:0;background:none;padding:0;display:none;z-index:4;cursor:pointer;font-family:inherit;color:#fff;touch-action:manipulation;-webkit-appearance:none}
#nova.on{display:block}
.nv-ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.nv-tr{fill:none;stroke:rgba(255,255,255,.1);stroke-width:4}
.nv-pg{fill:none;stroke:url(#nvg);stroke-width:4;stroke-linecap:round;stroke-dasharray:219.9;stroke-dashoffset:219.9;filter:drop-shadow(0 0 4px rgba(182,255,74,.6))}
.nv-core{position:absolute;inset:9px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 28%,#2b3350,#0b0e18 70%);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 8px 20px rgba(0,0,0,.5);transition:box-shadow .3s}
.nv-ic{grid-area:1/1;width:28px;height:28px;opacity:.28;transition:opacity .3s}
.nv-core b{grid-area:1/1;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.nv-lb{position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);padding:2px 9px;border-radius:10px;font-size:9px;font-weight:700;letter-spacing:.16em;color:#9aa0b6;background:#0a0c14;border:1px solid rgba(255,255,255,.14)}
#nova.rdy .nv-ic{opacity:1;animation:nvs 5s linear infinite,nvb 1.6s ease-in-out infinite;filter:drop-shadow(0 0 6px rgba(182,255,74,.8))}
#nova.rdy .nv-core{box-shadow:inset 0 0 16px rgba(182,255,74,.3),0 0 28px rgba(182,255,74,.45),0 8px 20px rgba(0,0,0,.5);border-color:rgba(182,255,74,.6)}
#nova.rdy .nv-lb{color:#0b1402;background:linear-gradient(180deg,#d6ff80,#9be82f);border-color:transparent}
#nova.rdy::after{content:'';position:absolute;inset:4px;border-radius:50%;border:2px solid #b6ff4a;animation:nvp 1.6s ease-out infinite;pointer-events:none}
@keyframes nvs{to{transform:rotate(360deg)}}
@keyframes nvb{0%,100%{scale:1}50%{scale:1.15}}
@keyframes nvp{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.35);opacity:0}}
#nova:active .nv-core{transform:scale(.94)}
#panel{margin-bottom:max(8px,env(safe-area-inset-bottom))}
#set{position:fixed;inset:0;z-index:60;background:rgba(4,7,12,.88);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .18s}
#set.on{opacity:1}
#set .sp{width:100%;max-width:520px;max-height:88vh;background:#0c121b;border:1px solid var(--line);border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);transform:translateY(24px);transition:transform .2s}
#set.on .sp{transform:none}
#set .sh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 8px;font-size:17px}
#set .sx{border:0;background:rgba(255,255,255,.08);color:var(--ink);width:34px;height:34px;border-radius:17px;font-size:15px}
#set .sb{overflow-y:auto;padding:4px 14px 18px;-webkit-overflow-scrolling:touch}
#set .st{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin:14px 2px 6px}
#set .rw{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
#set .rt{flex:1;min-width:0}#set .rt b{display:block;font-weight:500;font-size:14px}#set .rt span{display:block;font-size:11.5px;color:var(--dim);margin-top:2px;line-height:1.3}
#set .sw{flex:none;width:46px;height:27px;border-radius:14px;border:0;background:#26313c;position:relative;transition:background .15s}
#set .sw::after{content:'';position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#9fb3bd;transition:transform .15s,background .15s}
#set .sw.on{background:#1fae95}#set .sw.on::after{transform:translateX(19px);background:#fff}
#set .sg{flex:none;display:flex;gap:4px}#set .sg button{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);border-radius:8px;padding:7px 9px;font-size:12px;font-family:inherit}
#set .sg button.on{background:#1fae95;color:#03211b;border-color:transparent;font-weight:600}
#set input[type=range]{width:120px;accent-color:#34e8c8}
#set .bt{display:flex;gap:6px;margin-bottom:6px}#set .bt .g{padding:11px 4px;font-size:13px}
#set textarea{width:100%;box-sizing:border-box;background:#0b1117;color:#9fb;border:1px solid #234;border-radius:10px;padding:8px;font:11px monospace;margin-bottom:6px}

function fmt(n){
  if(!isFinite(n))return '∞';
  if(n<1000){if(n<10)return n.toFixed(2).replace(/\.?0+$/,'')||'0';return Math.floor(n).toString();}
  if(P.num==='sci')return n.toExponential(2).replace('e+','e');
  if(P.num==='full'&&n<1e15)return Math.floor(n).toLocaleString('fr-FR');
  const e=Math.floor(Math.log10(n)/3);if(e>=SUF.length)return n.toExponential(2).replace('e+','e');
  const v=n/Math.pow(1000,e);return v.toFixed(v<10?2:v<100?1:0)+SUF[e];
}

function holdBind(el,fn){
  let to=null,iv=null,sx=0,sy=0,fired=false,active=false;
  const stop=()=>{clearTimeout(to);clearInterval(iv);to=iv=null;};
  el.addEventListener('pointerdown',e=>{initAudio();sx=e.clientX;sy=e.clientY;fired=false;active=true;stop();
    to=setTimeout(()=>{fired=true;if(!fn(true))return;iv=setInterval(()=>{if(!fn(false))stop();},110);},450);});
  el.addEventListener('pointermove',e=>{if(active&&Math.hypot(e.clientX-sx,e.clientY-sy)>8){active=false;stop();}});
  el.addEventListener('pointerup',()=>{const ok=active&&!fired;active=false;stop();if(ok)fn(true);});
  ['pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,()=>{active=false;stop();}));
}

  for(const e of document.querySelectorAll('[title],[aria-label]')){for(const a of ['title','aria-label']){const v=e.getAttribute(a);if(v&&EN[v]!==undefined)e.setAttribute(a,EN[v]);}}}catch(e){}
const had=load();
if(!had)setTimeout(nativeRestore,500);
setTimeout(applyImmersive,300);
resize();
if(had){
  const away=Math.max(0,(Date.now()-S.last)/1000);
  if(away>30){const gn=offlineGain(away);if(gn>0){S.coins+=gn;S.total+=gn;setTimeout(()=>toast(_T('Pendant ton absence (')+fmtT(Math.min(away,8*3600))+') : +'+fmt(gn)+_T(' pièces')),600);}}
}
if(dailyReady())setTimeout(()=>toast(_T('🎁 Ton coffre du jour est prêt (onglet Missions)')),2600);
dispCoins=S.coins;genBoard();syncComets();buildTabs();buildList();applyPrefs();
let last=performance.now(),uiT=0,saveT=0,qFrames=0,qSlow=0,emaDt=.016;
let lastR=0,fpsE=.016,fpsT=0;
function frame(now){
  if(P.bat&&now-lastR<30){requestAnimationFrame(frame);return;}lastR=now;
  let dt=(now-last)/1000;last=now;
  if(dt>0&&dt<.5){fpsE+=(dt-fpsE)*.05;fpsT+=dt;if(fpsT>.5){fpsT=0;if(P.fps)fpsEl.textContent=Math.round(1/fpsE)+' fps · Q'+qLevel;}}
  if(qSet==='auto'&&dt<.5){if(++qFrames>90){emaDt+=(dt-emaDt)*.06;if(emaDt>.036){if(++qSlow>100&&qLevel>0){setQ(qLevel-1);qSlow=0;emaDt=.016;qFrames=60;}}else qSlow=Math.max(0,qSlow-2);}}
  if(dt>4){const gn=offlineGain(dt);S.coins+=gn;S.total+=gn;if(gn>1)toast(_T('Pendant ton absence : +')+fmt(gn)+_T(' pièces'));dt=.033;}
  dt=Math.min(dt,.05);
  ts=Math.min(1,ts+dt*1.4);step(dt*ts);render(dt);refreshHud(dt);
  uiT+=dt;if(uiT>.2){uiT=0;refreshUI();tutUpdate();}
  featT+=dt;if(featT>1){featT=0;achCheck();dcCheck();cdxScan();ambSync();}
  saveT+=dt;if(saveT>6){saveT=0;save();}
  requestAnimationFrame(frame);
}
if(window.__GEODE_TEST)window.__GEODE_TEST({quickBoost,ACHS,achCheck,dcEnsure,dcCheck,DCD,RELICS,RM,pickRelic,relChoices,cdxList,cdxScan,bossOf,SKINS,skinHue,openJournal,genBoard,get blocks(){return blocks;},get cdxN(){return cdxN;},renderRel,CH:CHS,DEALS,buyChest,buyDeal,claimFree,freeReady,giveChest,rollChest,openChest,todaysDeals,firePow,powAction,POWS,pcd,openSettings,closeSettings,P,get S(){return S;},set S(v){S=v;},save,load,sanitize,exportSave,decodeSave,importCode,resetGame,step,frame,buildList,buildTabs,setTab:t=>{tab=t;buildList();},refreshUI,fireNova,ascend,claimAll,dailyClaim,offlineGain,setQMode,get qLevel(){return qLevel;},fmt});
requestAnimationFrame(frame);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){save();notifSchedule();}else{wakeSet();notifCancel();}});
addEventListener('pagehide',save);
})();
</script>
