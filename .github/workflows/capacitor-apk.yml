name: Build APK Capacitor
on:
  push:
    branches: [main]
    paths: ['capacitor/**', '.github/workflows/capacitor-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Build
        working-directory: capacitor
        env: { RUN_NUMBER: '${{ github.run_number }}' }
        run: |
          set -o pipefail
          {
            npm install
            npx cap add android
            python3 patch_android.py
            npx cap sync android
            cd android
            chmod +x gradlew
            ./gradlew --no-daemon assembleRelease
          } 2>&1 | tee ../build.log
      - name: Publish APK
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp capacitor/android/app/build/outputs/apk/release/app-release.apk Geode-Capacitor.apk
          gh release delete capacitor --yes --cleanup-tag 2>/dev/null || true
          gh release create capacitor Geode-Capacitor.apk --title "Géode (Capacitor)" --notes "APK Capacitor : notifications, vibrations natives. Le jeu se charge depuis internet et se met à jour avec le bouton Mettre à jour (⚙)."
      - name: Publish log on failure
        if: failure()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          tail -n 400 build.log > build-tail.log || echo "pas de log" > build-tail.log
          gh release delete capacitor-log --yes --cleanup-tag 2>/dev/null || true
          gh release create capacitor-log build-tail.log --title "Log échec Capacitor" --notes "Journal de l'échec"
